[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "facetsetfem"
version = "0.1.0"
description = "Finite element simulator for transcutaneous electrical stimulation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Takashi Ota" }]
# 配布は GitHub（ソースと wheel）。PyPI には出さないので、誤って上げないよう印を残す（SPEC §11.2）
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# wheel を受け取った人が `pip install` だけで GUI まで動かせること（SPEC §12 の 3）。
# pyvistaqt は GUI の 3D ビュー（QtInteractor）に要る。
# vtk は pyvista も引くが、GUI が vtkmodules を直接 import しているので直接書く。
# VTK 9.7 で五面体（CPENTA）の節点の並びの約束が変わったが、入っている VTK の版を見て
# 切り替えるので、版の上限は置かない（SPEC §5.5。2026-11 に一時 vtk<9.7 を置いていた）
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "PySide6>=6.7",
  "vtk",
]

[project.urls]
Repository = "https://github.com/t-ota0407/FacetSetFEM"

[tool.maturin]
manifest-path = "crates/facetsetfem-py/Cargo.toml"
python-source = "python"
module-name = "facetsetfem._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
