[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "facetsetfem"
version = "0.1.0"
description = "Finite element simulator for transcutaneous electrical stimulation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Takashi Ota" }]
# 配布は GitHub（ソースと wheel）。PyPI には出さないので、誤って上げないよう印を残す（SPEC §11.2）
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# wheel を受け取った人が `pip install` だけで GUI まで動かせること（SPEC §12 の 3）。
# pyvistaqt は GUI の 3D ビュー（QtInteractor）に要る
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "PySide6>=6.7",
]

[project.urls]
Repository = "https://github.com/t-ota0407/FacetSetFEM"

[tool.maturin]
manifest-path = "crates/facetsetfem-py/Cargo.toml"
python-source = "python"
module-name = "facetsetfem._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
