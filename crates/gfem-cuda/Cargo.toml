[package]
name = "gfem-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "GenericFEM の CUDA バックエンド（SPEC §4.4 / §8 M5）"

[dependencies]
gfem-core.workspace = true
# CUDA ドライバ API の薄いラッパ。使うのは driver（メモリとカーネル起動）と
# nvrtc（カーネルの実行時コンパイル）だけで、cuBLAS などは要らない。
# 総和の順序を自分で決める必要があるため、既製の BLAS は使えない（SPEC §4.4）
cudarc = { workspace = true }
